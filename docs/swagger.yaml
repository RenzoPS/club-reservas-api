openapi: 3.0.0
info:
  title: Club Reservas API
  description: |-
    API REST para gestionar canchas, socios y reservas del Club Deportivo Encuentro.

    Todos los endpoints cuelgan del prefijo `/club_reservas_api`.

    Las fechas y horas se envian en formato ISO 8601 con desplazamiento fijo
    GMT-3 (`YYYY-MM-DDTHH:MM:SS.ffffff-03:00`) y se interpretan sin conversion
    de zona horaria.

    Los importes se expresan como enteros en centavos: `1000000` es $10.000,00.
  version: 1.0.0

servers:
  - url: http://localhost:5000/club_reservas_api

# =============================================================
# Cada uno documenta los endpoints de su recurso aca.
# Para evitar conflictos, agregar la seccion propia al final de
# `paths`, sin tocar las de los demas.
# =============================================================
paths:

  /deportes:
    get:
      summary: "Listar los deportes precargados"
      description: |-
        Los deportes se cargan mediante el script inicial y no admiten alta,
        modificacion ni eliminacion. Esta consulta no lleva paginacion.
      tags:
        - Deportes
      responses:
        '200':
          description: "Listado de deportes"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deportes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deporte'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /canchas:
    get:
      summary: "Listar canchas con paginacion"
      description: |-
        Los filtros son opcionales y se combinan con criterio AND. La busqueda
        por nombre es parcial y no distingue mayusculas de minusculas.

        Sin filtros se incluyen tanto las canchas activas como las inactivas.
      tags:
        - Canchas
      parameters:
        - name: id_deporte
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: nombre
          in: query
          description: "Busqueda parcial, sin distinguir mayusculas"
          required: false
          schema:
            type: string
          example: "futbol"
        - name: techada
          in: query
          required: false
          schema:
            type: boolean
          example: true
        - name: activa
          in: query
          required: false
          schema:
            type: boolean
          example: true
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "Listado de canchas"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanchasPaginadas'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: "Crear una cancha"
      description: |-
        El nombre no puede quedar vacio despues de quitar los espacios de sus
        extremos, el deporte debe existir y el precio debe ser un entero
        positivo expresado en centavos.
      tags:
        - Canchas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaCancha'
      responses:
        '201':
          description: "Cancha creada"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancha'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: "El deporte indicado no existe"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /canchas/disponibles:
    get:
      summary: "Consultar canchas activas libres durante todo un intervalo"
      description: |-
        El intervalo debe cumplir las mismas reglas que una reserva nueva:
        horas en punto, duracion de una a tres horas, dentro del horario del
        club (08:00 a 23:00), sin atravesar la medianoche y con inicio
        posterior al momento actual.

        La consulta informa la disponibilidad de las canchas. La habilitacion
        del socio y su agenda se validan al crear la reserva.

        Si no hay canchas libres responde 200 con un arreglo vacio.
      tags:
        - Canchas
      parameters:
        - name: fecha
          in: query
          description: "Fecha del intervalo, en formato YYYY-MM-DD"
          required: true
          schema:
            type: string
            format: date
          example: "2026-10-15"
        - name: hora_inicio
          in: query
          description: "Hora de inicio, en punto, formato HH:MM"
          required: true
          schema:
            type: string
          example: "18:00"
        - name: hora_fin
          in: query
          description: "Hora de fin, en punto, formato HH:MM"
          required: true
          schema:
            type: string
          example: "20:00"
        - name: id_deporte
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: techada
          in: query
          required: false
          schema:
            type: boolean
          example: true
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "Canchas libres durante todo el intervalo"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanchasPaginadas'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /canchas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: "Obtener los datos de una cancha"
      description: |-
        El estado `activa` no indica que la cancha este libre en todos los
        horarios.
      tags:
        - Canchas
      responses:
        '200':
          description: "Detalle de la cancha"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancha'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      summary: "Actualizar parcialmente una cancha"
      description: |-
        Los campos omitidos conservan su valor y se aplican las validaciones
        del alta. El deporte asociado no se modifica una vez creada la cancha.

        Cambiar el precio no altera los importes de las reservas existentes,
        que conservan la tarifa vigente al momento de registrarse.
      tags:
        - Canchas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarCancha'
      responses:
        '200':
          description: "Cancha actualizada"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancha'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: "Eliminar una cancha"
      description: |-
        Solo se elimina si no tiene ninguna reserva asociada, sin importar el
        estado de esas reservas. Si las tiene, se responde 409 y la cancha
        puede desactivarse mediante PATCH.
      tags:
        - Canchas
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "La cancha tiene reservas asociadas"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /socios:
    get:
      summary: "Listar socios con paginacion"
      description: |-
        Los filtros son opcionales y se combinan con criterio AND. La busqueda
        por nombre es parcial y no distingue mayusculas de minusculas.
      tags:
        - Socios
      parameters:
        - name: nombre
          in: query
          description: "Busqueda parcial, sin distinguir mayusculas"
          required: false
          schema:
            type: string
          example: "garcia"
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
          example: true
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "Listado de socios"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SociosPaginados'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: "Registrar un socio"
      description: |-
        El nombre no puede quedar vacio y el correo debe tener un formato valido.
        Se almacena en minusculas y sin espacios en sus extremos.

        El servidor asigna `activo: true`, por lo que el cliente no envia ese campo.

        Un correo ya registrado produce 409, incluso si el socio existente esta
        inactivo.
      tags:
        - Socios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoSocio'
      responses:
        '201':
          description: "Socio registrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Socio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: "El correo ya esta registrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /socios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: "Consultar los datos de un socio"
      tags:
        - Socios
      responses:
        '200':
          description: "Detalle del socio"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Socio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      summary: "Actualizar parcialmente un socio"
      description: |-
        Los campos omitidos conservan su valor y se aplican las validaciones del
        alta, incluida la unicidad del correo.

        No existe un endpoint de eliminacion: la baja es logica, con `activo: false`.
      tags:
        - Socios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarSocio'
      responses:
        '200':
          description: "Socio actualizado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Socio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "El correo pertenece a otro socio"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reservas:
    get:
      summary: "Listar reservas con paginacion"
      description: |-
        El rango de fechas se aplica al dia de utilizacion de la cancha, con ambos
        extremos incluidos. Puede enviarse un solo extremo; si se envian los dos,
        debe cumplirse `fecha_desde <= fecha_hasta`.

        Se permite consultar reservas pasadas.
      tags:
        - Reservas
      parameters:
        - name: id_cancha
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: id_socio
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [confirmada, cancelada, finalizada]
          example: "confirmada"
        - name: fecha_desde
          in: query
          description: "Formato YYYY-MM-DD"
          required: false
          schema:
            type: string
            format: date
          example: "2026-10-01"
        - name: fecha_hasta
          in: query
          description: "Formato YYYY-MM-DD"
          required: false
          schema:
            type: string
            format: date
          example: "2026-10-31"
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "Listado de reservas"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservasPaginadas'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: "Crear una reserva"
      description: |-
        El socio y la cancha deben existir y estar activos. El intervalo debe
        comenzar y terminar en horas en punto, durar entre una y tres horas,
        quedar dentro del horario del club (08:00 a 23:00), no atravesar la
        medianoche y comenzar despues del momento actual.

        No se admiten superposiciones con reservas confirmadas, ni para la cancha
        ni para el socio, aunque sean en canchas distintas.

        El servidor asigna el estado `confirmada`, conserva la tarifa vigente de
        la cancha y calcula el total como la cantidad de horas por esa tarifa.

        Si alguna validacion falla, no se guarda la reserva.
      tags:
        - Reservas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaReserva'
      responses:
        '201':
          description: "Reserva creada"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: "El socio o la cancha no existen"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '409':
          description: "Entidad inactiva o superposicion de horarios"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reservas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: "Obtener todos los campos de una reserva"
      description: |-
        Incluye el estado, la tarifa historica y el importe total.
      tags:
        - Reservas
      responses:
        '200':
          description: "Detalle de la reserva"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reservas/{id}/estado:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: "Establecer el estado de una reserva"
      description: |-
        Transiciones permitidas:

        | Estado actual | Estado solicitado | Condicion |
        |---------------|-------------------|-----------|
        | confirmada | cancelada | el horario de inicio todavia no llego |
        | confirmada | finalizada | se alcanzo o supero el horario de fin |
        | cancelada | otro estado | no permitido |
        | finalizada | otro estado | no permitido |

        Repetir el estado actual devuelve exito sin modificar la reserva. Una
        cancelacion libera el horario pero no elimina el registro.
      tags:
        - Reservas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstado'
      responses:
        '200':
          description: "Reserva con su estado actual"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          description: "Estado desconocido"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "Transicion no permitida o fuera del momento permitido"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:

    # ---------- Deportes ----------
    Deporte:
      type: object
      description: "Deporte que se practica en una cancha del club"
      properties:
        id_deporte:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Futbol"

    # ---------- Canchas ----------
    Cancha:
      type: object
      description: "Datos de una cancha del club"
      properties:
        id_cancha:
          type: integer
          description: "Identificador de la cancha"
          example: 1
        nombre:
          type: string
          example: "Cancha 1 - Futbol 5"
        id_deporte:
          type: integer
          description: "Deporte asociado. No se modifica una vez creada la cancha"
          example: 1
        precio_hora:
          type: integer
          description: "Tarifa por hora en centavos. 1000000 es $10.000,00"
          minimum: 1
          example: 1200000
        techada:
          type: boolean
          example: false
        activa:
          type: boolean
          description: "Una cancha activa puede estar ocupada en algunos horarios"
          example: true

    NuevaCancha:
      type: object
      description: "Datos requeridos para crear una cancha"
      required:
        - nombre
        - id_deporte
        - precio_hora
      properties:
        nombre:
          type: string
          description: "No puede quedar vacio despues de quitar espacios en sus extremos"
          example: "Cancha 1 - Futbol 5"
        id_deporte:
          type: integer
          description: "El deporte debe existir"
          minimum: 1
          example: 1
        precio_hora:
          type: integer
          description: "Entero positivo, en centavos"
          minimum: 1
          example: 1200000
        techada:
          type: boolean
          default: false
        activa:
          type: boolean
          default: true

    ActualizarCancha:
      type: object
      description: |-
        Campos editables de una cancha. Debe enviarse al menos uno.
        `id_deporte` no es editable y se rechaza como campo desconocido.
      minProperties: 1
      properties:
        nombre:
          type: string
          example: "Cancha 1 - Futbol 5"
        precio_hora:
          type: integer
          minimum: 1
          example: 1500000
        techada:
          type: boolean
          example: true
        activa:
          type: boolean
          example: false

    CanchasPaginadas:
      type: object
      description: "Listado de canchas con paginacion y enlaces de navegacion"
      properties:
        canchas:
          type: array
          items:
            $ref: '#/components/schemas/Cancha'
        _limit:
          type: integer
          example: 10
        _offset:
          type: integer
          example: 0
        _links:
          $ref: '#/components/schemas/Links'

    # ---------- Socios ----------
    Socio:
      type: object
      description: "Persona registrada en el club"
      properties:
        id_socio:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Alejandro Gomez"
        email:
          type: string
          format: email
          description: "Unico, almacenado en minusculas y sin espacios"
          example: "alejandro.gomez@email.com"
        activo:
          type: boolean
          description: "Un socio inactivo no puede registrar nuevas reservas"
          example: true

    NuevoSocio:
      type: object
      description: "Datos requeridos para registrar un socio"
      required:
        - nombre
        - email
      properties:
        nombre:
          type: string
          description: "No puede quedar vacio despues de quitar espacios en sus extremos"
          example: "Alejandro Gomez"
        email:
          type: string
          format: email
          description: "Se almacena en minusculas, sin espacios. Debe ser unico"
          example: "alejandro.gomez@email.com"

    ActualizarSocio:
      type: object
      description: |-
        Campos editables de un socio. Debe enviarse al menos uno.
      minProperties: 1
      properties:
        nombre:
          type: string
          example: "Alejandro Gomez"
        email:
          type: string
          format: email
          example: "nuevo.correo@email.com"
        activo:
          type: boolean
          example: false

    SociosPaginados:
      type: object
      description: "Listado de socios con paginacion y enlaces de navegacion"
      properties:
        socios:
          type: array
          items:
            $ref: '#/components/schemas/Socio'
        _limit:
          type: integer
          example: 10
        _offset:
          type: integer
          example: 0
        _links:
          $ref: '#/components/schemas/Links'

    # ---------- Reservas ----------
    Reserva:
      type: object
      description: "Asignacion de una cancha a un socio en un intervalo horario"
      properties:
        id_reserva:
          type: integer
          example: 1
        id_socio:
          type: integer
          example: 1
        id_cancha:
          type: integer
          example: 2
        fecha_hora_inicio:
          type: string
          description: "ISO 8601 con desplazamiento fijo GMT-3 y 6 digitos de fraccion"
          example: "2026-10-15T18:00:00.000000-03:00"
        fecha_hora_fin:
          type: string
          example: "2026-10-15T20:00:00.000000-03:00"
        estado:
          type: string
          enum: [confirmada, cancelada, finalizada]
          example: "confirmada"
        precio_hora_aplicado:
          type: integer
          description: |-
            Tarifa vigente al registrar la reserva, en centavos. No cambia aunque
            despues se modifique el precio de la cancha
          example: 1000000
        total:
          type: integer
          description: "Cantidad de horas por la tarifa aplicada, en centavos"
          example: 2000000

    NuevaReserva:
      type: object
      description: "Datos requeridos para crear una reserva"
      required:
        - id_socio
        - id_cancha
        - fecha_hora_inicio
        - fecha_hora_fin
      properties:
        id_socio:
          type: integer
          minimum: 1
          example: 1
        id_cancha:
          type: integer
          minimum: 1
          example: 2
        fecha_hora_inicio:
          type: string
          description: "Hora en punto, posterior al momento actual"
          example: "2026-10-15T18:00:00.000000-03:00"
        fecha_hora_fin:
          type: string
          description: "Hora en punto, entre una y tres horas despues del inicio"
          example: "2026-10-15T20:00:00.000000-03:00"

    CambioEstado:
      type: object
      description: "Nuevo estado solicitado para la reserva"
      required:
        - estado
      properties:
        estado:
          type: string
          enum: [confirmada, cancelada, finalizada]
          example: "cancelada"

    ReservasPaginadas:
      type: object
      description: "Listado de reservas con paginacion y enlaces de navegacion"
      properties:
        reservas:
          type: array
          items:
            $ref: '#/components/schemas/Reserva'
        _limit:
          type: integer
          example: 10
        _offset:
          type: integer
          example: 0
        _links:
          $ref: '#/components/schemas/Links'

    # ---------- Errores ----------
    Errores:
      type: object
      properties:
        errors:
          type: array
          description: "Listado de errores"
          items:
            $ref: '#/components/schemas/Error'
    Error:
      type: object
      description: "Estructura de datos que contiene los detalles del error"
      properties:
        code:
          type: string
          description: "Codigo de error alfanumerico unico legible por humanos"
          example: "cancha.not.found"
        message:
          type: string
          description: "Breve resumen del problema reportado"
          example: "Cancha no encontrada"
        level:
          type: string
          description: "Nivel del problema reportado"
          example: "error"
          enum:
            - info
            - warning
            - error
        description:
          type: string
          description: "Descripcion detallada del problema reportado"
          example: "No existe una cancha con id '99'"

    # ---------- Paginacion ----------
    Links:
      type: object
      description: |-
        Enlaces de navegacion HATEOAS. `_prev` es null en la primera pagina y
        `_next` es null en la ultima. Los filtros activos se conservan en los
        cuatro enlaces.
      properties:
        _first:
          type: string
          example: "/canchas?_limit=10&_offset=0"
        _prev:
          type: string
          nullable: true
          example: null
        _next:
          type: string
          nullable: true
          example: "/canchas?_limit=10&_offset=10"
        _last:
          type: string
          example: "/canchas?_limit=10&_offset=40"
    Paginacion:
      type: object
      description: |-
        Campos comunes a todas las respuestas de listado. Cada recurso agrega
        su propio arreglo bajo una clave descriptiva (`canchas`, `socios` o
        `reservas`).
      properties:
        _limit:
          type: integer
          description: "Cantidad de resultados por pagina"
          example: 10
        _offset:
          type: integer
          description: "Cantidad de resultados salteados"
          example: 0
        _links:
          $ref: '#/components/schemas/Links'

  parameters:
    Limit:
      name: _limit
      in: query
      description: "Cantidad de resultados por pagina"
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      example: 10
    Offset:
      name: _offset
      in: query
      description: "Cantidad de resultados a saltear"
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: 0
    Id:
      name: id
      in: path
      description: "Identificador del recurso"
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1

  responses:
    NoContent:
      description: "No Content"
    BadRequest:
      description: "Bad Request"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errores'
    NotFound:
      description: "Not Found"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errores'
    Conflict:
      description: "Conflict"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errores'
    InternalServerError:
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errores'
